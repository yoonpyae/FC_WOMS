server {
    # Listen on standard HTTP port 80
    listen 80;
    server_name familyclinics.site www.familyclinics.site;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Angular static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular routing (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy 
    location /api/ {
        # FIXED: Use your actual server IP instead of 127.0.0.1
        # so Docker knows to route out of the container to the host
        proxy_pass http://54.169.50.229:6007;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}