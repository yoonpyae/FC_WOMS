<form [formGroup]="patientForm" (submit)="submit()" class="p-fluid mt-2">
    <div class="grid">
        <div class="col-12 field">
            <label class="font-bold text-900 ml-1">Full Name</label>
            <span class="p-input-icon-left">
                <i class="pi pi-user"></i>
                <input formControlName="name" pInputText (input)="transformToUppercase('name')"
                    placeholder="e.g. JOHN DOE" />
            </span>
            <small *ngIf="patientForm.controls['name'].invalid && patientForm.get('name')?.dirty"
                class="text-red-500 mt-1 block anim-fade-in">Name is required.</small>
        </div>

        <div class="col-12 md:col-8 field">
            <label class="font-bold text-900 ml-1">Date of Birth</label>
            <p-date-picker formControlName="dob" [showIcon]="true" [dateFormat]="'yy-mm-dd'" [maxDate]="maxDate"
                placeholder="YYYY-MM-DD" styleClass="w-full">
            </p-date-picker>
            <small
                *ngIf="patientForm.get('dob')?.invalid && (patientForm.get('dob')?.touched || patientForm.get('dob')?.dirty)"
                class="text-red-500 mt-1 block">DOB is required.</small>
        </div>

        <div class="col-12 md:col-4 field">
            <label class="font-bold text-900 ml-1">Age</label>
            <input formControlName="age" pInputText class="surface-100 font-bold text-center" readonly />
        </div>

        <div class="col-12 md:col-6 field">
            <label class="font-bold text-900 ml-1">Phone Number</label>
            <span class="p-input-icon-left">
                <i class="pi pi-phone"></i>
                <input formControlName="phone" pInputText placeholder="09..." inputmode="tel" />
            </span>
            <small *ngIf="patientForm.controls['phone'].invalid && patientForm.get('phone')?.dirty"
                class="text-red-500 mt-1 block">Valid phone required.</small>
        </div>

        <div class="col-12 md:col-6 field">
            <label class="font-bold text-900 ml-1">Gender</label>
            <p-select [options]="genders" formControlName="gender" optionLabel="label"
                placeholder="Select Gender"></p-select>
        </div>
    </div>

    <p-divider align="left" styleClass="my-4">
        <span class="text-500 font-medium text-sm"><i class="pi pi-map-marker mr-2"></i>LOCATION</span>
    </p-divider>

    <div class="grid">
        <div class="col-12 md:col-6 field">
            <label class="font-bold text-900 ml-1">State</label>
            <p-select [options]="states" [(ngModel)]="SelectedState" (onChange)="onStateChange()"
                optionLabel="stateName" dataKey="stateId" placeholder="Select State"
                [ngModelOptions]="{ standalone: true }" [filter]="true" [showClear]="true" appendTo="body">
            </p-select>
        </div>

        <div class="col-12 md:col-6 field">
            <label class="font-bold text-900 ml-1">Township</label>
            <p-select [options]="townships" [(ngModel)]="SelectedTownship" (onChange)="onTownshipChange()"
                optionLabel="townshipName" dataKey="townshipId" placeholder="Select Township"
                [ngModelOptions]="{ standalone: true }" [filter]="true" [showClear]="true" appendTo="body">
            </p-select>
        </div>

        <div class="col-12 field">
            <label class="font-bold text-900 ml-1">Address Details</label>
            <textarea pInputTextarea rows="3" placeholder="Street name, House No..." formControlName="addressDetail"
                class="w-full"></textarea>
        </div>
    </div>

    <div class="flex align-items-center justify-content-between mt-3 p-3 surface-50 border-round-lg">
        <div class="flex align-items-center gap-3">
            <label class="font-bold text-700">Active Status</label>
            <p-toggle-switch formControlName="status"></p-toggle-switch>
        </div>

        <div class="flex gap-2">
            <p-button [label]="isEdit ? 'Update Patient' : 'Register Patient'" type="submit" [loading]="isSubmitting"
                [severity]="isEdit ? 'info' : 'success'"
                [icon]="isEdit ? 'pi pi-user-edit' : 'pi pi-user-plus'"></p-button>
        </div>
    </div>
</form>
