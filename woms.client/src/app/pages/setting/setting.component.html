<div class="grid grid-cols-12 min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
  <div class="col-span-12 flex items-center justify-center p-4">


    <div *ngIf="isDoctor"
      class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4 animate-fadein">
      <div
        class="bg-surface-0 dark:bg-surface-900 p-8 rounded-2xl border border-surface-200 dark:border-surface-700 shadow-sm max-w-md">
        <i class="pi pi-lock text-5xl text-primary mb-5 block"></i>
        <h2 class="text-2xl font-bold text-surface-900 dark:text-surface-0 mb-3">Branch Auto-Assigned</h2>
        <p class="text-surface-500 dark:text-surface-400 mb-6 leading-relaxed">
          As a registered doctor, your clinic branch is automatically secured and assigned based on your profile. You do
          not need to select one manually.
        </p>
        <p-button label="Go to Dashboard" icon="pi pi-arrow-right" (onClick)="goToDashboard()"
          styleClass="w-full"></p-button>
      </div>
    </div>

    <div *ngIf="!isDoctor">

      <div
        class="flex flex-col justify-center w-full max-w-md p-6 sm:p-8 rounded-xl shadow-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 transition-colors duration-200">

        <div class="text-center mb-8">
          <img src="images/Family_Clinics_Logo_only.png" alt="Family Clinic Logo"
            class="h-16 mx-auto mb-4 drop-shadow-sm">
          <h2 class="text-2xl font-bold text-gray-900 dark:text-white m-0">Site Settings</h2>
          <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm">Configure your active branch session.</p>
        </div>

        <div class="flex flex-col gap-6">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Default Branch <span
                class="text-red-500">*</span></label>
            <p-select [options]="branchs" [(ngModel)]="selectedbranch" [style]="{ 'width':'100%' }"
              [disabled]="disabledbranch" optionLabel="branchName" [showClear]="true" placeholder="Select a Branch"
              styleClass="w-full">
            </p-select>
          </div>

          <div class="mt-2">
            <p-button pRipple
              styleClass="w-full p-3 bg-[#00B6C7] border-[#00B6C7] text-white rounded-lg font-semibold text-base hover:bg-[#0096a7] hover:border-[#0096a7] transition-colors"
              (click)="onSubmit()">
              <i class="pi pi-check font-bold mr-2"></i> Submit
            </p-button>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
