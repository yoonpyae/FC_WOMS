<div class="grid grid-cols-12 min-h-screen">
  <div class="col-span-12 flex items-center justify-center">
    <div class="flex flex-col justify-center w-full max-w-md p-6 rounded-lg shadow-lg bg-white">
      <h2 class="font-bold mt-2 text-center">Site Setting</h2>
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-2">
          <label>Default Branch</label>
          <p-select [options]="branchs" [(ngModel)]="selectedbranch" [style]="{ 'width':'100%' }"
            [disabled]="disabledbranch" optionLabel="branchName" [showClear]="true"
            placeholder="Select a Branch"></p-select>
        </div>
        <div>
          <button pButton pRipple class="w-full flex items-center justify-center gap-3" (click)="onSubmit()">
            <i class="pi pi-check"></i> Submit
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
