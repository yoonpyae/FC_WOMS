<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 font-sans">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center border border-gray-100">

    <div class="mx-auto flex items-center justify-center h-24 w-24 rounded-full bg-red-50 mb-6 border border-red-100">
      <i class="pi pi-lock text-5xl text-red-500"></i>
    </div>

    <h1 class="text-3xl font-bold text-gray-900 mb-2">Access Denied</h1>
    <p class="text-gray-500 mb-8 leading-relaxed text-sm">
      You do not have the necessary permissions to view this page. If you believe this is a mistake, please contact your
      system administrator.
    </p>

    <div class="flex flex-col gap-3">
      <p-button label="Go to Dashboard" icon="pi pi-home" styleClass="w-full" (onClick)="goHome()">
      </p-button>

      <p-button label="Logout" icon="pi pi-power-off" severity="danger" styleClass="w-full p-button-outlined"
        (onClick)="onLogout()">
      </p-button>
    </div>

  </div>

</div>
