<p-button label="Pharmacy" [style]="{ width:'100%' }" (onClick)="showDialog()" />

<p-dialog [header]="'Pharmacy'" [(visible)]="modalVisible" maskStyleClass="backdrop-blur-sm" (onHide)="onDialogHide()"
    [breakpoints]="{
    '1920px': '26vw',
    '1440px': '40vw',
    '1024px': '50vw',
    '768px': '60vw',
    '425px': '80vw',
    '375px': '100vw',
    '320px': '100vw',
  }" [modal]="true" [style]="{ 'min-width': '26vw'}" [draggable]="false" [resizable]="false">

    <div class="grid grid-cols-1 gap-5">
        <!-- Item Name Dropdown -->
        <div class="col-span-1 flex flex-col">
            <label class="mb-1 font-medium">Item Name</label>
            <p-select [options]="pharmacyStock" [style]="{'width': '100%'}" [(ngModel)]="selectedOTDeptStock"
                optionLabel="itemName" dataKey="itemCode" placeholder="Select item"
                [ngModelOptions]="{ standalone: true }" [loading]="loading" [filter]="true" [showClear]="true"
                (onChange)="onChanges($event)" [disabled]="!isEnabled"></p-select>
        </div>

        <!-- PacketType -->
        <div class="col-span-1 flex flex-col">
            <label class="mb-1 font-medium">Packet Type</label>
            <input pInputText [value]="selectedOTDeptStock ? (selectedOTDeptStock.typeName ) : ''"
                [disabled]="!selectedOTDeptStock" readonly
                class="w-full Pharmacyed-md bg-gray-100 px-3 py-2 text-gray-700 cursor-not-allowed" />
        </div>

        <!-- Gound Balance -->
        <div class="col-span-1 flex flex-col">
            <label class="mb-1 font-medium">Balance</label>
            <input pInputText [value]="selectedOTDeptStock ? (selectedOTDeptStock.quantity | number:'1.0-2') : ''"
                [disabled]="!selectedOTDeptStock" readonly
                class="w-full Pharmacyed-md bg-gray-100 px-3 py-2 text-gray-700 cursor-not-allowed" />
        </div>

        <!-- Price -->
        <div class="col-span-1 flex flex-col">
            <label class="mb-1 font-medium">Price</label>
            <input pInputText [value]="selectedOTDeptStock ? (selectedOTDeptStock.salePrice | number:'1.0-2') : ''"
                [disabled]="!selectedOTDeptStock" readonly
                class="w-full Pharmacyed-md bg-gray-100 px-3 py-2 text-gray-700 cursor-not-allowed" />
        </div>

        <!-- Quantity -->
        <div class="col-span-1 flex flex-col">
            <label class="mb-1 font-medium">Quantity</label>
            <input pInputText type="number" placeholder="Enter Quantity." required min="0" [(ngModel)]="quantity"
                (keypress)="preventNegativeInput($event)" [disabled]="!selectedOTDeptStock"
                [ngModelOptions]="{ standalone: true }" />
        </div>

        <!-- Total -->
        <div class="col-span-1">
            <label class="mb-1 font-medium">Total</label>
            <input pInputText type="number" required min="0" readonly [value]="totalAmount"
                class="w-full Pharmacyed-md bg-gray-100 px-3 py-2 text-gray-700 cursor-not-allowed" />
        </div>

        <div class="grid-cols-2 flex gap-2 mt-3">
            <!-- Save -->
            <p-button icon="pi pi-check" severity="success" label="Save" (click)="submit()" />

            <!-- Cancel -->
            <p-button icon="pi pi-times" label="Cancel" (click)="cancel()" />
        </div>
    </div>
</p-dialog>
