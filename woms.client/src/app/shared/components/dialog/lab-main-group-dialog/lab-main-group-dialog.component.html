<!-- button  -->
<p-button label="Lab Main Group" [style]="{ width:'100%' }" (onClick)="showDialog()"></p-button>

<!-- dialog  -->
<p-dialog [header]="'Lab Main Group List - '+ mode" maskStyleClass="backdrop-blur-sm" [(visible)]="labMainModalVisible"
    (onHide)="onDialogHide()" [breakpoints]="{
    '1920px': '50vw',
    '1440px': '30vw',
    '1024px': '30vw',
    '768px': '80vw',
    '425px': '100vw',
    '375px': '100vw',
    '320px': '100vw'
  }" [modal]="true" [style]="{ 'min-width': '50vw' }" [draggable]="false" [resizable]="false">

    <!-- table  -->
    <p-table #dt4 [value]="labMainGroups" [(selection)]="selectedLabMainGroup" [rows]="20" [showGridlines]="false"
        [loading]="labMainloading" [tableStyle]="{ 'min-width': '50rem' }" styleClass="p-datatable-striped"
        selectionMode="multiple" dataKey="mainGroupName" class="p-datatable-sm h-[300px]" [metaKeySelection]="metaKey">

        <!-- header  -->
        <ng-template pTemplate="header">
            <tr class="whitespace-nowrap">
                <th pFrozenColumn class="w-4">#</th>
                <th pSortableColumn="mainGroupName">Lab Main Group Name<p-sortIcon field="mainGroupName"></p-sortIcon>
                </th>
                <th pSortableColumn="laboratory">Laboratory <p-sortIcon field="laboratory"></p-sortIcon></th>
                <th pSortableColumn="fee">Fee <p-sortIcon field="fee"></p-sortIcon></th>
            </tr>
        </ng-template>

        <!-- body  -->
        <ng-template pTemplate="body" let-labMainGroup>
            <tr class="whitespace-nowrap" [pSelectableRow]="labMainGroup">
                <td>
                    <p-tableCheckbox [value]="labMainGroup"></p-tableCheckbox>
                </td>
                <td>{{ labMainGroup.mainGroupName }}</td>
                <td>{{ labMainGroup.accessory || 'N/A' }}</td>
                <td>{{ labMainGroup.fee | number:'1.0-0'}}</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- footer  -->
    <div class="grid-cols-2 flex gap-2 mt-5">
        <!-- Save -->
        <p-button icon="pi pi-check" severity="success" label="Save" (click)="submit()" />

        <!-- Cancel -->
        <p-button icon="pi pi-times" label="Cancel" (click)="cancel()" />
    </div>
</p-dialog>
