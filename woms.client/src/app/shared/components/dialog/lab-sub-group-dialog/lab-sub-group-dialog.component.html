<!-- button  -->
<p-button label="Lab Sub Group" [style]="{ width:'100%' }" (onClick)="showDialog()"></p-button>

<!-- dialog -->
<p-dialog header="Lab Sub Group List" maskStyleClass="backdrop-blur-sm" [(visible)]="modalVisible"
    (onHide)="onDialogHide()" [breakpoints]="{
    '1920px': '50vw',
    '1440px': '30vw',
    '1024px': '30vw',
    '768px': '80vw',
    '425px': '100vw',
    '375px': '100vw',
    '320px': '100vw'
  }" [modal]="true" [style]="{ 'min-width': '50vw' }" [draggable]="false" [resizable]="false">

    <!-- table  -->
    <p-table #dt4 [value]="labSubGroups" [(selection)]="selectedLabSubGroup" [rows]="20" [showGridlines]="false"
        [loading]="labSubloading" [tableStyle]="{ 'min-width': '50rem' }" styleClass="p-datatable-striped"
        selectionMode="multiple" dataKey="labSubGroupName" [metaKeySelection]="metaKey"
        class="p-datatable-sm h-[300px]">

        <!-- header  -->
        <ng-template pTemplate="header">
            <tr class="whitespace-nowrap">
                <th pFrozenColumn class="w-4">#</th>
                <th pSortableColumn="labSubGroupName">Sub Group Name<p-sortIcon field="labSubGroupName"></p-sortIcon>
                </th>
                <th pSortableColumn="laboratory">Laboratory <p-sortIcon field="laboratory"></p-sortIcon></th>
                <th pSortableColumn="fee">Fee <p-sortIcon field="fee"></p-sortIcon></th>
            </tr>
        </ng-template>

        <!-- body  -->
        <ng-template pTemplate="body" let-labSubGroup>
            <tr class="whitespace-nowrap" [pSelectableRow]="labSubGroup">
                <td>
                    <p-tableCheckbox [value]="labSubGroup"></p-tableCheckbox>
                </td>
                <td>{{ labSubGroup.labSubGroupName }}</td>
                <td>{{ labSubGroup.accessory || 'N/A'}}</td>
                <td>{{ labSubGroup.fee | number:'1.0-0'}}</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- footer  -->
    <div class="grid-cols-2 flex gap-2 mt-5">
        <!-- Save -->
        <p-button icon="pi pi-check" severity="success" label="Save" (click)="submit()" />

        <!-- Cancel -->
        <p-button icon="pi pi-times" label="Cancel" (click)="cancel()" />
    </div>
</p-dialog>
