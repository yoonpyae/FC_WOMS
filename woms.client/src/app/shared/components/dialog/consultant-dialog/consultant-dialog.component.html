<p-button label="Consultant" [style]="{ width:'100%' }" (onClick)="showDialog()" />

<p-dialog [header]="'Consultant - ' + mode" [(visible)]="modalVisible" maskStyleClass="backdrop-blur-sm"
    (onHide)="onDialogHide()" [breakpoints]="{
    '1920px': '26vw',
    '1440px': '40vw',
    '1024px': '50vw',
    '768px': '60vw',
    '425px': '80vw',
    '375px': '100vw',
    '320px': '100vw',
  }" [modal]="true" [style]="{ 'min-width': '26vw'}" [draggable]="false" [resizable]="false">

    <div class="grid grid-cols-1 gap-5">
        <!-- Doctor Dropdown -->
        <div class="flex flex-col">
            <label class="mb-1 font-medium">Doctor</label>
            <app-doctor-drop-down [(ngModel)]="selectedDoctor" (ngModelChange)="onDoctorChange()"
                placeholder="Select Consultant" class="w-full  focus:ring-blue-400"
                [ngModelOptions]="{ standalone: true }" appendTo="body">
            </app-doctor-drop-down>
        </div>

        <!-- Consultant Fee -->
        <div class="flex flex-col">
            <label class="mb-1 font-medium">Consultant Fee</label>
            <input pInputText [value]="selectedDoctor ? (selectedDoctor.consultantFee | number:'1.0-2') : ''"
                [disabled]="!selectedDoctor" readonly
                class="w-full rounded-md bg-gray-100 px-3 py-2 text-gray-700 cursor-not-allowed" />
        </div>

        <div class="grid-cols-2 flex gap-2 mt-3">
            <!-- Save -->
            <p-button icon="pi pi-check" severity="success" label="Save" (click)="submit()" />

            <!-- Cancel -->
            <p-button icon="pi pi-times" label="Cancel" (click)="cancel()" />
        </div>
    </div>
</p-dialog>
